put:
  tags:
    - admin
  summary: upgrade a plugin
  description: This operation upgrades a nodebb plugin to the supplied version
  parameters:
    - in: path
      name: pluginId
      schema:
        type: string
      required: true
      description: a nodebb plugin id
      example: nodebb-plugin-imgur
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - version
          properties:
            version:
              type: string
  responses:
    '200':
      description: plugin succesfully upgraded
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                $ref: ../../../../components/schemas/Status.yaml#/Status
              response:
                type: object
    '400':
      $ref: ../../../../components/responses/400.yaml#/400