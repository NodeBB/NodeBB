post:
  tags:
    - admin
  summary: Rotate an OAuth 2.0 client secret
  description: Generates a new client secret for a confidential OAuth 2.0 client. The new secret is returned once and cannot be retrieved again.
  parameters:
    - name: clientId
      schema:
        type: string
      in: path
      required: true
      description: The client identifier
      example: "my-client-id"
  responses:
    '200':
      description: New client secret
      content:
        application/json:
          schema:
            type: object
            properties:
              secret:
                type: string
                description: The new client secret. This is the only time it will be shown.
    '400':
      $ref: ../../../../../components/responses/400.yaml#/400
    '404':
      $ref: ../../../../../components/responses/404.yaml#/404
