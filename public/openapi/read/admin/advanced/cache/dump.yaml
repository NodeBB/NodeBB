get:
  tags:
    - admin
  summary: Get system cache info
  parameters:
    - in: query
      name: name
      schema:
        type: string
        enum: ['post', 'object', 'group', 'local']
      required: false
      description: Specify cache to dump if calling `/dump`
      example: 'post'
  responses:
    "200":
      description: System cache information
      content:
        application/json:
          schema:
            type: object
            description: The type of response is dependent on the database used. Please examine the output.
            properties:
              cache:
                type: object
                description: Dump of the underlying LRU/TTL cache contents
              invalidationVersions:
                type: object
                description: Dump of cache invalidation version tracking
            additionalProperties: true